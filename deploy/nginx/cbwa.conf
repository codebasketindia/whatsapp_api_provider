# /etc/nginx/sites-available/cbwa.conf  (ln -s to sites-enabled)
# Replace wa.example.com with your domain. Certbot fills in the ssl_certificate lines.

limit_req_zone $binary_remote_addr zone=cbwa_auth:10m rate=20r/m;

upstream cbwa_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name wa.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wa.example.com;

    ssl_certificate     /etc/letsencrypt/live/wa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/cbwa;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API -> Spring Boot
    location /api/ {
        proxy_pass http://cbwa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Login / OTP endpoints get an extra edge rate limit (the app also limits per IP)
    location ~ ^/api/auth/(login|forgot-password|reset-password|otp) {
        limit_req zone=cbwa_auth burst=10 nodelay;
        proxy_pass http://cbwa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live inbox (Server-Sent Events): no buffering, long timeout
    location /api/public/inbox-stream {
        proxy_pass http://cbwa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Webhooks from Meta / Razorpay (raw body must reach the app unchanged)
    location /api/webhooks/ {
        proxy_pass http://cbwa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
    }

    location = /actuator/health {
        proxy_pass http://cbwa_backend;
    }

    # Swagger UI only from the office IP (set CBWA_SWAGGER_ENABLED=true to use it)
    location ~ ^/(swagger-ui|v3/api-docs) {
        # allow 203.0.113.10;
        deny all;
        proxy_pass http://cbwa_backend;
    }

    # Static assets (hashed by Vite) - cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing: every other path serves index.html (never cached)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
