# Local development profile (default when no profile is set). NEVER use it in production.
# Database: a local MySQL by default. To use another database, set CBWA_DB_URL / CBWA_DB_USERNAME / CBWA_DB_PASSWORD
# in your shell or IDE run configuration - never commit real database credentials to this file.
spring.datasource.url=${CBWA_DB_URL:jdbc:mysql://127.0.0.1:3306/cbwa?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
spring.datasource.username=${CBWA_DB_USERNAME:cbwa_app}
spring.datasource.password=${CBWA_DB_PASSWORD:}

cbwa.dev-mode=true
cbwa.cors-allowed-origins=${CBWA_CORS_ALLOWED_ORIGINS:*}
# Dev-only fallback secrets so the app starts out of the box; production must set its own.
cbwa.security.jwt-secret=${CBWA_JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tY2J3YS1kZXYtb25seS1qd3Qtc2VjcmV0LTY0Ynl0ZXM=}
cbwa.security.encryption-key=${CBWA_ENCRYPTION_KEY:ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=}
cbwa.security.api-secret-pepper=${CBWA_API_SECRET_PEPPER:ZGV2LW9ubHktcGVwcGVyLWNid2EtZGV2LXBlcHBlciE=}
cbwa.seed.admin-mobile=${CBWA_SEED_ADMIN_MOBILE:9999999999}
cbwa.seed.admin-email=${CBWA_SEED_ADMIN_EMAIL:admin@cbwa.local}
cbwa.seed.admin-password=${CBWA_SEED_ADMIN_PASSWORD:Admin@12345}

logging.level.in.codebasket.cbwa=DEBUG
