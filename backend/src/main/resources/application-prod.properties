# Production profile for sms.codebasket.in

server.port=8085
cbwa.dev-mode=false

# Database configuration (set via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/whatsapp_sms?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Skip schema validation for MySQL 5.x compatibility
spring.jpa.hibernate.ddl-auto=none

# Disable background jobs (if MySQL 5.x)
cbwa.jobs.enabled=false

# Security secrets (set via environment variables, base64 encoded)
cbwa.security.jwt-secret=${JWT_SECRET}
cbwa.security.encryption-key=${ENCRYPTION_KEY}
cbwa.security.api-secret-pepper=${API_SECRET_PEPPER}

# URLs
cbwa.public-base-url=https://sms.codebasket.in/v.1
cbwa.frontend-url=https://sms.codebasket.in
cbwa.cors-allowed-origins=https://sms.codebasket.in

# Admin seed credentials (set via environment variables)
cbwa.seed.admin-mobile=${ADMIN_MOBILE:9999999999}
cbwa.seed.admin-email=${ADMIN_EMAIL:admin@codebasket.in}
cbwa.seed.admin-password=${ADMIN_PASSWORD}

# Storage
cbwa.storage.path=/opt/whatsapp_api/storage

# Swagger disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
