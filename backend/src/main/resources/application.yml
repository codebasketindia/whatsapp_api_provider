spring:
  application:
    name: cbwa
  profiles:
    default: dev
  datasource:
    url: ${CBWA_DB_URL:jdbc:mysql://127.0.0.1:3306/cbwa?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
    username: ${CBWA_DB_USERNAME:cbwa_app}
    password: ${CBWA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${CBWA_DB_POOL_MAX:20}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: ${CBWA_MAX_UPLOAD_MB:16}MB
      max-request-size: 20MB
  mail:
    host: ${CBWA_MAIL_HOST:}
    port: ${CBWA_MAIL_PORT:587}
    username: ${CBWA_MAIL_USERNAME:}
    password: ${CBWA_MAIL_PASSWORD:}
  threads:
    virtual:
      enabled: true

server:
  port: ${CBWA_SERVER_PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${CBWA_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${CBWA_SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  packages-to-scan: in.codebasket.cbwa

cbwa:
  public-base-url: ${CBWA_PUBLIC_BASE_URL:http://localhost:8080}
  frontend-url: ${CBWA_FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CBWA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${CBWA_JWT_SECRET:}
    access-ttl-minutes: ${CBWA_JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${CBWA_JWT_REFRESH_TTL_DAYS:7}
    encryption-key: ${CBWA_ENCRYPTION_KEY:}
    api-secret-pepper: ${CBWA_API_SECRET_PEPPER:}
  seed:
    admin-mobile: ${CBWA_SEED_ADMIN_MOBILE:}
    admin-email: ${CBWA_SEED_ADMIN_EMAIL:}
    admin-password: ${CBWA_SEED_ADMIN_PASSWORD:}
  storage:
    path: ${CBWA_STORAGE_PATH:./storage}
  mail:
    from: ${CBWA_MAIL_FROM:no-reply@localhost}
  queue:
    worker-threads: ${CBWA_QUEUE_WORKER_THREADS:8}
    batch-size: ${CBWA_QUEUE_BATCH_SIZE:50}
  meta:
    graph-base-url: ${CBWA_META_GRAPH_BASE_URL:https://graph.facebook.com}
  razorpay:
    base-url: ${CBWA_RAZORPAY_BASE_URL:https://api.razorpay.com}
  jobs:
    enabled: ${CBWA_JOBS_ENABLED:true}
