# Shared settings for every profile. Secrets always come from environment variables (see .env.example).
# Profiles: local (default, developer machine), prod (server, /etc/cbwa/cbwa.env), test (integration tests).

spring.application.name=cbwa
spring.profiles.default=local
spring.datasource.url=${CBWA_DB_URL:jdbc:mysql://127.0.0.1:3306/cbwa?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
spring.datasource.username=${CBWA_DB_USERNAME:cbwa_app}
spring.datasource.password=${CBWA_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${CBWA_DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=2
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=${CBWA_MAX_UPLOAD_MB:16}MB
spring.servlet.multipart.max-request-size=20MB
spring.mail.host=${CBWA_MAIL_HOST:}
spring.mail.port=${CBWA_MAIL_PORT:587}
spring.mail.username=${CBWA_MAIL_USERNAME:}
spring.mail.password=${CBWA_MAIL_PASSWORD:}
spring.threads.virtual.enabled=true

server.port=${CBWA_SERVER_PORT:8080}
server.forward-headers-strategy=native
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

springdoc.api-docs.enabled=${CBWA_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${CBWA_SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=in.codebasket.cbwa

cbwa.public-base-url=${CBWA_PUBLIC_BASE_URL:http://localhost:8080}
cbwa.frontend-url=${CBWA_FRONTEND_URL:http://localhost:5173}
cbwa.cors-allowed-origins=${CBWA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
cbwa.security.jwt-secret=${CBWA_JWT_SECRET:}
cbwa.security.access-ttl-minutes=${CBWA_JWT_ACCESS_TTL_MINUTES:15}
cbwa.security.refresh-ttl-days=${CBWA_JWT_REFRESH_TTL_DAYS:7}
cbwa.security.encryption-key=${CBWA_ENCRYPTION_KEY:}
cbwa.security.api-secret-pepper=${CBWA_API_SECRET_PEPPER:}
cbwa.seed.admin-mobile=${CBWA_SEED_ADMIN_MOBILE:}
cbwa.seed.admin-email=${CBWA_SEED_ADMIN_EMAIL:}
cbwa.seed.admin-password=${CBWA_SEED_ADMIN_PASSWORD:}
cbwa.storage.path=${CBWA_STORAGE_PATH:./storage}
cbwa.mail.from=${CBWA_MAIL_FROM:no-reply@localhost}
cbwa.queue.worker-threads=${CBWA_QUEUE_WORKER_THREADS:8}
cbwa.queue.batch-size=${CBWA_QUEUE_BATCH_SIZE:50}
cbwa.meta.graph-base-url=${CBWA_META_GRAPH_BASE_URL:https://graph.facebook.com}
cbwa.razorpay.base-url=${CBWA_RAZORPAY_BASE_URL:https://api.razorpay.com}
cbwa.jobs.enabled=${CBWA_JOBS_ENABLED:true}
